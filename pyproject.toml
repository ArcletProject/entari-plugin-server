[project]
name = "entari-plugin-server"
version = "0.8.2"
description = "Entari plugin for running Satori Server"
authors = [
    {name = "RF-Tar-Railt", email = "rf_tar_railt@qq.com"},
]
dependencies = [
    "arclet-entari>=0.19.0.post2",
    "satori-python-server<1.4.0,>=1.3.11",
    "satori-python-core<1.4.0,>=1.3.11",
    "satori-python-client<1.4.0,>=1.3.11",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
keywords = ["server", "adapters", "satori", "entari", "plugin"]

[project.urls]
homepage = "https://github.com/ArcletProject/entari-plugin-server"
repository = "https://github.com/ArcletProject/entari-plugin-server"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.116.1",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true


[dependency-groups]
dev = [
    "arclet-entari[dotenv,reload,yaml]>=0.19.2.post2",
    "satori-python-adapter-onebot11>=0.5.2",
    "satori-python-adapter-console>=0.5.3",
    "fastapi>=0.116.1",
    "graia-amnesia>=0.11.5",
    "satori-python-adapter-qq>=0.4.0rc4",
]

[tool.pyright]
typeCheckingMode = "basic"
