[project]
name = "entari-plugin-server"
version = "0.6.0"
description = "Entari plugin for running Satori Server"
authors = [
    {name = "RF-Tar-Railt", email = "rf_tar_railt@qq.com"},
]
dependencies = [
    "arclet-entari<0.18.0,>=0.17.0rc1",
    "satori-python-server<1.4.0,>=1.3.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/ArcletProject/entari-plugin-server"
repository = "https://github.com/ArcletProject/entari-plugin-server"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.116.1",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true


[dependency-groups]
dev = [
    "arclet-entari[dotenv,reload,yaml]>=0.17.0",
    "satori-python-adapter-onebot11>=0.4.1",
    "satori-python-adapter-console>=0.5.1",
    "fastapi>=0.116.1",
    "graia-amnesia>=0.11.5",
    "satori-python-adapter-qq>=0.2.0",
]
